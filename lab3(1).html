<!DOCTYPE html>
<html>
<head>
    <title>Semantic Web Page</title>

    <style>
        body {
            font-family: Arial;
            margin: 0;
            background-color: lightgray;
        }

        header {
            background-color: navy;
            color: white;
            text-align: center;
            padding: 20px;
        }

        nav {
            background-color: black;
            padding: 15px;
        }

        nav a {
            color: white;
            margin: 15px;
            text-decoration: none;
        }

        main {
            padding: 20px;
            background-color: white;
        }

        footer {
            background-color: navy;
            color: white;
            text-align: center;
            padding: 10px;
        }
    </style>
</head>

<body>

    <header>
        <h1>My Website</h1>
        <p>Learning Semantic HTML5</p>
    </header>

    <nav>
        <a href="#">Home</a>
        <a href="#">About</a>
        <a href="#">Services</a>
        <a href="#">Contact</a>
    </nav>

    <main>
        <section>
            <h2>Welcome</h2>
            <p>This is my first semantic HTML5 webpage.</p>
        </section>
    </main>

    <footer>
        <p>© 2026 My Website</p>
    </footer>

</body>
</html>
